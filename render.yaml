services:
  - type: web
    name: telegram-calendar-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --loop asyncio --http h11
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONFAULTHANDLER
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_USER_1_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_USER_1_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_USER_1_CALENDAR_ID
        value: primary
      - key: TELEGRAM_USER_2_ID
        sync: false
      - key: GOOGLE_USER_2_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_USER_2_CALENDAR_ID
        value: primary
      - key: USER_TIMEZONE
        value: Asia/Singapore
      - key: SCHEDULER_SECRET
        sync: false
      - key: DAILY_AGENDA_HOUR
        value: "8"
      - key: CRON_JOB_API_KEY
        sync: false
      - key: SERVICE_BASE_URL
        sync: false
